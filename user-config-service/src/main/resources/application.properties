spring.application.name=demo

spring.datasource.url=jdbc:sqlite:user-config.db?foreign_keys=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Schema is owned by schema.sql: Hibernate's SQLite dialect can't emit
# foreign keys or multi-column unique constraints (no ALTER TABLE support).
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Services return fully loaded data, so no lazy loading is needed while writing responses.
spring.jpa.open-in-view=false
